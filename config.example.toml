# McTiler v0.1. Copy to ~/.config/mctiler/config.toml, then run mctiler reload.
# Supported TOML subset: scalar values, [bindings], [workspaces], and [[rules]].
# Strings use double quotes; multiline strings, arrays, dotted keys, and inline
# tables are not supported. Invalid configuration is rejected with a line number.
inner-gap = 8
outer-gap = 8

# Requested, but currently unavailable: status explains why. This NEVER changes
# Dock preferences or substitutes an auto-show delay for complete suppression.
experimental-suppress-dock = true

# Omit [bindings] to use all defaults. If present, it REPLACES the default table.
# Keys are physical US keyboard positions. Option is spelled alt.
# Modifiers: cmd, ctrl, alt, shift. Defaults use Option, not Command.
[bindings]
alt-left = "focus left"
alt-right = "focus right"
alt-up = "focus up"
alt-down = "focus down"
alt-shift-left = "move left"
alt-shift-right = "move right"
alt-shift-up = "move up"
alt-shift-down = "move down"
alt-ctrl-left = "resize left 10"
alt-ctrl-right = "resize right 10"
alt-ctrl-up = "resize up 10"
alt-ctrl-down = "resize down 10"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-shift-1 = "send 1"
alt-shift-2 = "send 2"
alt-shift-3 = "send 3"
alt-shift-4 = "send 4"
alt-shift-5 = "send 5"
alt-shift-6 = "send 6"
alt-shift-7 = "send 7"
alt-shift-8 = "send 8"
alt-shift-9 = "send 9"
alt-shift-escape = "fullscreen"
alt-ctrl-space = "workspace-floating"
alt-ctrl-f = "fullscreen"
alt-ctrl-h = "split horizontal"
alt-ctrl-v = "split vertical"
alt-ctrl-p = "select parent"
alt-ctrl-c = "select child"
alt-ctrl-r = "reload"
alt-ctrl-escape = "pause"

# Display IDs are UUIDs reported by `mctiler status`.
# Multiple workspaces can prefer the same monitor; the first numbered assignment
# is initially visible there. Switch to others with workspace commands.
# [workspaces]
# "1" = "DISPLAY-UUID"
# "2" = "DISPLAY-UUID"

# First matching bundle ID wins. Rules apply when a window is first discovered.
# [[rules]]
# bundle = "com.apple.systempreferences"
# floating = true
#
# [[rules]]
# bundle = "com.apple.Terminal"
# workspace = "2"
#
# [[rules]]
# bundle = "some.application.bundle"
# ignore = true
